Summary: Ambient lofi study & deep relaxation flight deck
Description: |-
  FlyLofi Focus Flight transforms your device into an immersive ambient flight cabin
  engineered for deep focus, studying, flow-state productivity, and tranquil relaxation.

  Key features:
  * Cruise mode with atmospheric cabin and cockpit visuals
  * Ambient airplane cabin white noise
  * Curated lofi audio tracks with offline playback
  * Completely offline, no tracking, no ads, zero telemetry
  * Battery-efficient native rendering

