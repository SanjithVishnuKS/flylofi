<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flylofi — Destination Showcase</title>
<style>
:root{--bg:#071117;--line:rgba(198,220,225,.18);--muted:#91a9b0;--text:#f4f8f8;--green:#59dfa0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,rgba(28,67,76,.48),transparent 58%),linear-gradient(145deg,#071117,#0b1b22 58%,#071117);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;position:relative;display:grid;place-items:center;padding:5.5%;overflow:hidden}.ambient{position:absolute;inset:-20%;background:radial-gradient(circle at 22% 18%,rgba(67,121,127,.12),transparent 25%),radial-gradient(circle at 78% 82%,rgba(54,137,105,.10),transparent 28%);filter:blur(28px);pointer-events:none}
.header{position:absolute;top:7%;left:8%;right:8%;display:flex;justify-content:space-between;align-items:center;color:#d9e6e8;letter-spacing:.19em;font-size:clamp(10px,1vw,17px);font-weight:750}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:clamp(24px,2.4vw,40px);aspect-ratio:1;border:1px solid rgba(120,205,178,.5);border-radius:50%;display:grid;place-items:center;color:var(--green);letter-spacing:0}.eyebrow{color:var(--muted);font-weight:600}
.ticket-wrap{width:min(78%,1120px);perspective:1400px;transform:translateY(1%)}.ticket{min-height:clamp(270px,37vw,510px);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr minmax(170px,24%);border:1px solid rgba(206,230,233,.24);border-radius:clamp(18px,2.1vw,32px);background:linear-gradient(120deg,rgba(255,255,255,.035),transparent 38%),linear-gradient(145deg,#142a34,#0d1c24 68%,#10242c);box-shadow:0 36px 100px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.06);transition:opacity .32s ease,transform .32s ease}.ticket.enter{opacity:0;transform:translateY(18px) rotateX(3deg) scale(.985)}
.ticket-main{padding:clamp(24px,4vw,58px);display:flex;flex-direction:column;justify-content:space-between}.ticket-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.ticket-label{color:#9fb7bd;letter-spacing:.2em;font-size:clamp(9px,.85vw,14px);font-weight:750}.status{color:var(--green);background:rgba(27,103,73,.24);border:1px solid rgba(89,223,160,.38);padding:.65em 1em;border-radius:999px;font-size:clamp(9px,.8vw,13px);font-weight:800;letter-spacing:.09em;white-space:nowrap}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:3%;margin:5% 0}.airport-code{font-size:clamp(48px,8.3vw,112px);line-height:.95;letter-spacing:-.055em;font-weight:780}.city{margin-top:12px;font-size:clamp(14px,2vw,27px);font-weight:700;letter-spacing:.025em}.country{color:var(--muted);margin-top:7px;font-size:clamp(10px,1vw,15px);letter-spacing:.17em}.plane{color:#a6bec3;font-size:clamp(24px,3vw,42px);display:grid;place-items:center;padding:0 10px}.ticket-bottom{display:flex;justify-content:space-between;align-items:end;gap:20px;border-top:1px solid var(--line);padding-top:22px}.micro{color:var(--muted);font-size:clamp(8px,.75vw,12px);letter-spacing:.15em}.checked{color:var(--green);font-size:clamp(13px,1.35vw,19px);font-weight:850;letter-spacing:.08em}
.stub{border-left:1px dashed rgba(201,223,226,.32);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:clamp(20px,3vw,42px) 16px;background:rgba(255,255,255,.018);position:relative}.stub:before,.stub:after{content:"";position:absolute;left:-12px;width:24px;height:24px;border-radius:50%;background:#0a171e;border:1px solid rgba(206,230,233,.18)}.stub:before{top:-12px}.stub:after{bottom:-12px}.stamp{width:clamp(88px,11vw,150px);aspect-ratio:1;border:2px solid rgba(89,223,160,.8);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--green);font-size:clamp(10px,1.15vw,16px);font-weight:900;line-height:1.3;transform:rotate(-12deg);box-shadow:0 0 30px rgba(89,223,160,.08)}.stamp span{display:block;font-size:1.65em}.serial{color:#789198;font-size:clamp(8px,.7vw,11px);letter-spacing:.2em;writing-mode:vertical-rl}
.progress{position:absolute;left:8%;right:8%;bottom:8%;display:flex;align-items:center;gap:18px}.progress-track{height:3px;background:rgba(211,231,233,.13);flex:1;border-radius:10px;overflow:hidden}.progress-fill{height:100%;width:0%;background:var(--green);box-shadow:0 0 12px rgba(89,223,160,.6)}.counter{color:#b5c8cc;font-size:clamp(10px,.9vw,14px);letter-spacing:.13em;min-width:74px;text-align:right}.controls{position:absolute;right:8%;bottom:12%;display:flex;gap:8px;opacity:.65}button{border:1px solid rgba(200,225,228,.22);color:#dce9ea;background:rgba(12,29,37,.7);border-radius:999px;padding:8px 13px;font:inherit;cursor:pointer}button:hover{border-color:rgba(89,223,160,.65);color:var(--green)}
@media(max-aspect-ratio:4/3){.ticket-wrap{width:90%}.ticket{grid-template-columns:1fr 22%}.ticket-main{padding:4%}.stub{padding:4% 8px}}
</style><link rel="stylesheet" href="ticket-enhancements.css"></head>
<body><main class="stage" aria-label="Focus Flight destination ticket showcase"><div class="ambient"></div>
<header class="header"><div class="brand"><span class="brand-mark">✈</span><span>FLYLOFI</span></div><span class="eyebrow">DESTINATION SHOWCASE</span></header>
<section class="ticket-wrap"><article class="ticket" id="ticket"><span class="destination-badge" id="destinationBadge">DESTINATION LOCKED</span><div class="ticket-main"><div class="ticket-top"><span class="ticket-label">VIRTUAL BOARDING PASS</span><span class="status">● CHECKED IN</span></div>
<div class="route"><div><div class="airport-code" id="code">MAA</div><div class="city" id="city">CHENNAI</div><div class="country" id="country">INDIA</div></div><div class="plane">✈</div><div style="text-align:right"><div class="airport-code" style="color:#91a9b0">24</div><div class="city" style="color:#91a9b0">DESTINATIONS</div><div class="country">FOCUS JOURNEY</div></div></div>
<div class="ticket-bottom"><div><div class="micro">BOARDING STATUS</div><div class="checked">✓ CHECKED IN</div></div><div class="micro">A JOURNEY TOWARDS FOCUS</div></div></div>
<aside class="stub"><div class="ticket-label">STATUS</div><div class="stamp"><div><span>✓</span>CHECKED<br>IN</div></div><div class="serial" id="serial">FF · 001 / 024</div></aside></article></section>
<div class="progress"><div class="micro">24 DESTINATIONS</div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="counter" id="counter">01 / 24</div></div>
 </main>
<script>
const destinations=[
["Chennai","MAA","INDIA"],["Mumbai","BOM","INDIA"],["New Delhi","DEL","INDIA"],["Bengaluru","BLR","INDIA"],["Hyderabad","HYD","INDIA"],["Singapore","SIN","SINGAPORE"],["Bangkok","BKK","THAILAND"],["Hong Kong","HKG","HONG KONG"],["Seoul","ICN","SOUTH KOREA"],["Tokyo","NRT","JAPAN"],["Sydney","SYD","AUSTRALIA"],["Melbourne","MEL","AUSTRALIA"],["Dubai","DXB","UAE"],["Doha","DOH","QATAR"],["London","LHR","UNITED KINGDOM"],["Amsterdam","AMS","NETHERLANDS"],["Paris","CDG","FRANCE"],["Frankfurt","FRA","GERMANY"],["Istanbul","IST","TÜRKIYE"],["New York","JFK","USA"],["San Francisco","SFO","USA"],["Los Angeles","LAX","USA"],["Chicago","ORD","USA"],["Toronto","YYZ","CANADA"]];
const ticket=document.getElementById('ticket'),code=document.getElementById('code'),city=document.getElementById('city'),country=document.getElementById('country'),serial=document.getElementById('serial'),counter=document.getElementById('counter'),progressFill=document.getElementById('progressFill'),destinationBadge=document.getElementById('destinationBadge');const params=new URLSearchParams(location.search),requested=params.get('destination');const palette={MAA:['#59dfa0','rgba(89,223,160,.22)'],BOM:['#f0b36f','rgba(240,179,111,.22)'],DEL:['#e4cf82','rgba(228,207,130,.22)'],BLR:['#7ed9c1','rgba(126,217,193,.22)'],HYD:['#e88d9a','rgba(232,141,154,.22)'],SIN:['#66d4e5','rgba(102,212,229,.22)'],BKK:['#f29a73','rgba(242,154,115,.22)'],HKG:['#e86f82','rgba(232,111,130,.22)'],ICN:['#8cb3f0','rgba(140,179,240,.22)'],NRT:['#f09bb7','rgba(240,155,183,.22)'],SYD:['#78c9e6','rgba(120,201,230,.22)'],MEL:['#d3a6ef','rgba(211,166,239,.22)'],DXB:['#e8c278','rgba(232,194,120,.22)'],DOH:['#a4d5c3','rgba(164,213,195,.22)'],LHR:['#91b9e8','rgba(145,185,232,.22)'],AMS:['#e79b75','rgba(231,155,117,.22)'],CDG:['#b8a8eb','rgba(184,168,235,.22)'],FRA:['#b6d59a','rgba(182,213,154,.22)'],IST:['#f08f78','rgba(240,143,120,.22)'],JFK:['#8bd0d1','rgba(139,208,209,.22)'],SFO:['#d6b477','rgba(214,180,119,.22)'],LAX:['#e89d75','rgba(232,157,117,.22)'],ORD:['#99b6dc','rgba(153,182,220,.22)'],YYZ:['#e9a1bd','rgba(233,161,189,.22)']};let index=Math.max(0,destinations.findIndex((destination)=>destination[1]===requested));if(index<0)index=0;let startTime=null,raf=null;const locked=Boolean(requested),CARD_MS=2000,TOTAL_MS=destinations.length*CARD_MS;
function showDestination(i){const [name,airport,nation]=destinations[i];const colors=palette[airport]||palette.MAA;document.body.style.setProperty('--city-accent',colors[0]);document.body.style.setProperty('--city-glow',colors[1]);destinationBadge.textContent=locked?`${name.toUpperCase()} · SELECTED`:'DESTINATION SHOWCASE';ticket.classList.add('enter');setTimeout(()=>{city.textContent=name.toUpperCase();code.textContent=airport;country.textContent=nation;serial.textContent=`FF · ${String(i+1).padStart(3,'0')} / 024`;counter.textContent=`${String(i+1).padStart(2,'0')} / 24`;progressFill.style.width=`${((i+1)/destinations.length)*100}%`;ticket.classList.remove('enter')},180)}
function tick(now){if(startTime===null)startTime=now;const elapsed=now-startTime,next=Math.min(Math.floor(elapsed/CARD_MS),destinations.length-1);if(next!==index){index=next;showDestination(index)}if(elapsed<TOTAL_MS)raf=requestAnimationFrame(tick);else progressFill.style.width='100%'}
function replay(){if(raf)cancelAnimationFrame(raf);if(locked){showDestination(index);return}index=0;startTime=null;showDestination(0);progressFill.style.width='0%';counter.textContent='01 / 24';raf=requestAnimationFrame(tick)}
showDestination(index);if(!locked)raf=requestAnimationFrame(tick);
</script></body></html>
